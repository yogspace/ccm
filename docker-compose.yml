services:
  # Service name = host name in the proxy network: the proxy stack routes
  # ccm.mxwr.de → ccm:3000. Must be unique in the `web` network.
  ccm:
    image: ghcr.io/yogspace/ccm:latest
    restart: unless-stopped
    # Protects the other apps on the server (portfolio among others).
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

  # Mini API (the “x creations made” counter). Runs straight from the checkout
  # (/opt/apps/ccm/api), so no image of its own; the number lives in the volume.
  # ccm forwards /api/* here (see Caddyfile).
  ccm-api:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/app/api/server.mjs"]
    environment:
      DATA_DIR: /data
    volumes:
      - ./api:/app/api:ro
      - ccm-data:/data
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - web

volumes:
  ccm-data:

networks:
  # Shared network of the proxy stack (/opt/apps/proxy), created externally.
  web:
    external: true
