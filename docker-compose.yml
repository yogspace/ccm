services:
  # Service name = host name in the proxy network: the proxy stack routes
  # ccm.mxwr.de → ccm:3000. Must be unique in the `web` network.
  ccm:
    image: ghcr.io/yogspace/ccm:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: mongodb://mongo:27017/ccm
      MEDIA_DIR: /data/media
    # Secrets and mail settings (see .env.example) – /opt/apps/ccm/.env.
    # Without it the deploy stops here and the running version stays.
    env_file:
      - .env
    # Uploads (gallery pictures, template SVGs) outlive the deploys here;
    # `pnpm payload:media:sync` fetches them.
    volumes:
      - media:/data/media
    depends_on:
      mongo:
        condition: service_healthy
    # Next + Payload take ~200 MB; room for spikes, and the other apps on the
    # server (portfolio among others) stay safe.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
      - web

  # Statistics and interface texts (Payload). Only in the internal network –
  # not reachable from outside; `pnpm payload:db:sync` goes over SSH.
  mongo:
    # Pinned like the portfolio's: Linux ≥ 6.19 (the host runs 7.0) turns on
    # CET shadow stacks, and MongoDB 8.x coroutines swap the stack pointer by
    # hand → SIGSEGV crash loop (MongoDB SERVER-121912). Workaround: shadow
    # stacks off for mongod (GLIBC_TUNABLES). Do NOT switch to `mongo:8.0` –
    # that refuses to start on ≥ 6.19. Unpin once MongoDB ships a fix.
    image: mongo:8.2.9
    restart: unless-stopped
    # A small cache: the database holds a few thousand small rows.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      GLIBC_TUNABLES: "glibc.cpu.hwcaps=-SHSTK"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    # Logs on, rotated – a silent crash loop must stay visible.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

volumes:
  mongo_data:
  media:

networks:
  internal:
  # Shared network of the proxy stack (/opt/apps/proxy), created externally.
  web:
    external: true
