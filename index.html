<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <!-- seo: title, description, preview – per language from vite.config.ts -->
    <!-- /seo -->
    <meta content="Maximilian Weber" name="author" />
    <!-- Outgoing links name their origin (only the domain, never the hash with the shape). -->
    <meta content="strict-origin-when-cross-origin" name="referrer" />
    <meta content="#2a44ff" media="(prefers-color-scheme: light)" name="theme-color" />
    <meta content="#141c86" media="(prefers-color-scheme: dark)" name="theme-color" />
    <link
      as="font"
      crossorigin
      href="/fonts/Pally-Variable.woff2"
      rel="preload"
      type="font/woff2"
    />
    <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
    <link href="/favicon-32.png" rel="icon" sizes="32x32" type="image/png" />
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" />
    <link href="/manifest.webmanifest" rel="manifest" />
  </head>
  <body>
    <div id="root"></div>
    <noscript><!-- noscript --><!-- /noscript --></noscript>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
