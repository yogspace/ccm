services:
  # Service-Name = Hostname im Proxy-Netz: der Proxy-Stack routet
  # ccm.mxwr.de → ccm:3000. Muss im Netz `web` eindeutig sein.
  ccm:
    image: ghcr.io/yogspace/ccm:latest
    restart: unless-stopped
    # Schutz für die anderen Apps auf dem Server (u. a. Portfolio).
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

  # Mini-API (Zähler „x Kreationen erstellt“). Läuft direkt aus dem Checkout
  # (/opt/apps/ccm/api), daher kein eigenes Image; die Zahl liegt im Volume.
  # ccm leitet /api/* hierher weiter (siehe Caddyfile).
  ccm-api:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/app/api/server.mjs"]
    environment:
      DATA_DIR: /data
    volumes:
      - ./api:/app/api:ro
      - ccm-data:/data
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - web

volumes:
  ccm-data:

networks:
  # Geteiltes Netz des Proxy-Stacks (/opt/apps/proxy), extern angelegt.
  web:
    external: true
